services:
  rsshub:
    image: diygod/rsshub:latest
    container_name: crypto-rsshub
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=memory
      - CACHE_EXPIRE=300
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: crypto-backend
    ports:
      - "3001:3000"
    volumes:
      - backend_data:/app/data
    environment:
      - RSSHUB_BASE=http://rsshub:1200
    depends_on:
      - rsshub
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: crypto-frontend
    ports:
      - "3080:3080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
